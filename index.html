<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            height: 100%;

            display: block;
        }

</head>

    <img src="images.jpg" alt="Imagem">

</html>
